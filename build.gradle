plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// See settings.gradle: mirror of Maven Central, consulted before the real thing.
	def centralMirror = maven {
		name = 'MavenCentralGoogleMirror'
		url = 'https://maven-central.storage-download.googleapis.com/maven2/'
	}
	remove(centralMirror)
	addFirst(centralMirror)
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// Automated playtest: a real client (and a real dedicated server) driven by Fabric's client game test API.
// Lives in src/gametest and is NOT included in the shipped jar.  Run with: ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "backrooms-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true // only used by the throwaway dedicated test server
	}
}
